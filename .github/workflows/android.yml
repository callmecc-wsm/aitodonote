name: Android APK
on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "tests/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Check UI logic
        run: node --test tests/core.test.cjs
      - name: Compile, lint and test
        run: gradle --no-daemon :app:assembleDebug :app:testDebugUnitTest :app:lintDebug
      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/NoteNote-0.1.0-test.apk
          sha256sum dist/*.apk > dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: NoteNote-Android-APK
          path: dist/
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-build-reports
          path: app/build/reports/
  device-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Device persistence, key storage and launch tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_3
          disable-animations: true
          script: |
            gradle --no-daemon :app:connectedDebugAndroidTest
            adb shell am start -n app.notenote.todo.test/app.notenote.todo.MainActivity
            sleep 3
            mkdir -p device-evidence
            adb exec-out screencap -p > device-evidence/android-home.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-device-evidence
          path: |
            app/build/reports/androidTests/
            device-evidence/

  publish-test:
    needs: [build, device-test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: NoteNote-Android-APK
          path: dist
      - name: Publish downloadable test APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cat > release-notes.md <<'NOTES'
          Android 个人测试版。下载下方 APK，在 Android 8.0 及以上设备安装。

          首次可离线记录；真实 AI 需在应用内配置自己的模型接口和 API Key。联网检索另需 Tavily Key。

          此版本通过编译、Lint、单元测试与 Android 模拟器测试。后台执行受安卓省电策略影响。测试签名可能随构建变化，如覆盖安装冲突，请先导出旧版记录再卸载安装。
          NOTES
          gh release create "test-${GITHUB_RUN_NUMBER}" dist/NoteNote-0.1.0-test.apk dist/SHA256SUMS.txt --target "$GITHUB_SHA" --title "Note Note 0.1.0 · Test ${GITHUB_RUN_NUMBER}" --prerelease --notes-file release-notes.md
