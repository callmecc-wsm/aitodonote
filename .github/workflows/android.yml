name: Android APK
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/android.yml"
      - "ci/**"
      - "app/**"
      - "tests/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Check UI logic
        run: |
          node --check app/src/main/assets/app.js
          node --test tests/core.test.cjs
      - name: Compile, lint and test
        run: |
          gradle --no-daemon :app:assembleDebug :app:testDebugUnitTest :app:lintDebug
          python3 ci/test_report.py app/build/test-results
      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/NoteNote-0.2.0-test.apk
          sha256sum dist/*.apk > dist/SHA256SUMS.txt
          cat dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: NoteNote-Android-APK
          path: dist/
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-build-reports
          path: app/build/reports/
  device-test:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        api: [26, 29, 35]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Device persistence, key storage and launch tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          profile: pixel_3
          disable-animations: true
          script: bash ci/device-tests.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-device-evidence-API-${{ matrix.api }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/connected/
            device-evidence/
